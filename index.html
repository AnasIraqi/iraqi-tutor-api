<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المعلم العراقي الذكي</title>
  <style>
    :root {
      --primary: #156d3b;
      --primary-hover: #0f522c;
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #1a1a1a;
      --text-muted: #555555;
      --border: #d0d7de;
    }
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }
    .card {
      background: var(--card);
      width: 100%;
      max-width: 520px;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      border: 1px solid var(--border);
    }
    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    .header h1 {
      margin: 0 0 6px 0;
      color: var(--primary);
      font-size: 1.55rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .header p {
      margin: 0;
      color: var(--text-muted);
      font-size: 0.88rem;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 0.9rem;
    }
    select, textarea {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: #fafbfc;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    select:focus, textarea:focus {
      border-color: var(--primary);
      background-color: #ffffff;
    }
    textarea {
      resize: vertical;
      min-height: 90px;
    }
    .btn {
      width: 100%;
      padding: 12px;
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover {
      background-color: var(--primary-hover);
    }
    .btn:disabled {
      background-color: #9cbda8;
      cursor: not-allowed;
    }
    .btn-action {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px;
      border-radius: 8px;
      border: none;
      color: #fff;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      flex: 1;
      transition: opacity 0.2s;
    }
    .btn-action:hover {
      opacity: 0.9;
    }
    .btn-camera {
      background-color: #2563eb;
    }
    .btn-gallery {
      background-color: #4b5563;
    }
    .preview-box {
      margin-top: 8px;
      padding: 8px 12px;
      background: #eef2ff;
      border: 1px dashed #6366f1;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.85rem;
    }
    .result-box {
      margin-top: 20px;
      padding: 16px;
      border-radius: 8px;
      background: #eef7f1;
      border: 1px solid #b8e0c7;
      display: none;
      white-space: pre-wrap;
      line-height: 1.6;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <h1>المعلم العراقي الذكي 🇮🇶</h1>
      <p>وفق المعايير الوزارية لمركز الفحص والتقويم</p>
    </div>

    <!-- المرحلة الدراسية -->
    <div class="form-group">
      <label for="stage">المرحلة الدراسية</label>
      <select id="stage" onchange="updateGrades()">
        <option value="الابتدائية">المرحلة الابتدائية</option>
        <option value="المتوسطة">المرحلة المتوسطة</option>
        <option value="الإعدادية">المرحلة الإعدادية</option>
      </select>
    </div>

    <!-- الصف الدراسي -->
    <div class="form-group">
      <label for="grade">الصف الدراسي</label>
      <select id="grade" onchange="updateSubjects()"></select>
    </div>

    <!-- المادة الدراسية -->
    <div class="form-group">
      <label for="subject">المادة</label>
      <select id="subject"></select>
    </div>

    <!-- نص السؤال -->
    <div class="form-group">
      <label for="question">اكتب السؤال الوزاري أو استفسارك المنهجي</label>
      <textarea id="question" placeholder="مثال: اعرب ما تحته خط، أو اكتب منطوق المسألة الرياضية..."></textarea>
    </div>

    <!-- أزرار التصوير والاستوديو -->
    <div class="form-group">
      <label>أرفق صورة السؤال / المسألة الوزارية (اختياري)</label>
      <div style="display: flex; gap: 10px; margin-top: 6px;">
        <button type="button" class="btn-action btn-camera" onclick="document.getElementById('cameraInput').click()">
          📷 التقاط صورة
        </button>
        <button type="button" class="btn-action btn-gallery" onclick="document.getElementById('galleryInput').click()">
          🖼️ من الاستوديو
        </button>
      </div>

      <!-- حقول الإدخال المخفية للكاميرا والملفات -->
      <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;" onchange="handleImageSelected(this)">
      <input type="file" id="galleryInput" accept="image/*" style="display: none;" onchange="handleImageSelected(this)">

      <!-- معاينة اسم الصورة وإلغاؤها -->
      <div id="imagePreviewContainer" style="display: none;" class="preview-box">
        <span id="imageName" style="color: #1e3a8a; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"></span>
        <button type="button" onclick="clearSelectedImage()" style="background: none; border: none; color: #dc2626; cursor: pointer; font-weight: bold;">✕ حذف الصورة</button>
      </div>
    </div>

    <!-- زر الإرسال -->
    <button class="btn" id="submitBtn" onclick="sendQuery()">الحصول على الجواب النموذجي الوزاري</button>

    <!-- صندوق النتيجة -->
    <div class="result-box" id="resultBox"></div>
  </div>

  <script>
    // بيانات المراحل والصفوف والمناهج العراقية
    const data = {
      "الابتدائية": {
        grades: [
          "الأول الابتدائي", 
          "الثاني الابتدائي", 
          "الثالث الابتدائي", 
          "الرابع الابتدائي", 
          "الخامس الابتدائي", 
          "السادس الابتدائي (وزاري)"
        ],
        subjects: [
          "التربية الإسلامية", 
          "اللغة العربية", 
          "الرياضيات", 
          "العلوم", 
          "اللغة الإنكليزية", 
          "الاجتماعيات"
        ]
      },
      "المتوسطة": {
        grades: [
          "الأول المتوسط", 
          "الثاني المتوسط", 
          "الثالث المتوسط (وزاري)"
        ],
        subjects: [
          "التربية الإسلامية", 
          "اللغة العربية", 
          "اللغة الإنكليزية", 
          "الرياضيات", 
          "الكيمياء", 
          "الفيزياء", 
          "الأحياء", 
          "الاجتماعيات"
        ]
      },
      "الإعدادية": {
        grades: [
          "الرابع العلمي", 
          "الرابع الأدبي", 
          "الخامس العلمي", 
          "الخامس الأدبي", 
          "السادس العلمي (وزاري)", 
          "السادس الأدبي (وزاري)"
        ],
        subjectsMap: {
          "علمي": [
            "التربية الإسلامية", 
            "اللغة العربية", 
            "اللغة الإنكليزية", 
            "الرياضيات", 
            "الكيمياء", 
            "الفيزياء", 
            "الأحياء"
          ],
          "أدبي": [
            "التربية الإسلامية", 
            "اللغة العربية", 
            "اللغة الإنكليزية", 
            "الرياضيات", 
            "التاريخ", 
            "الجغرافيا", 
            "الاقتصاد"
          ]
        }
      }
    };

    function updateGrades() {
      const stage = document.getElementById("stage").value;
      const gradeSelect = document.getElementById("grade");
      gradeSelect.innerHTML = "";

      const gradeList = data[stage].grades;
      gradeList.forEach(g => {
        const opt = document.createElement("option");
        opt.value = g;
        opt.textContent = g;
        gradeSelect.appendChild(opt);
      });

      updateSubjects();
    }

    function updateSubjects() {
      const stage = document.getElementById("stage").value;
      const grade = document.getElementById("grade").value;
      const subjectSelect = document.getElementById("subject");
      subjectSelect.innerHTML = "";

      let subs = [];
      if (stage === "الإعدادية") {
        if (grade.includes("أدبي")) {
          subs = data["الإعدادية"].subjectsMap["أدبي"];
        } else {
          subs = data["الإعدادية"].subjectsMap["علمي"];
        }
      } else {
        subs = data[stage].subjects;
      }

      subs.forEach(s => {
        const opt = document.createElement("option");
        opt.value = s;
        opt.textContent = s;
        subjectSelect.appendChild(opt);
      });
    }

    // إدارة الصور والكاميرا
    let activeImageFile = null;

    function handleImageSelected(input) {
      if (input.files && input.files[0]) {
        activeImageFile = input.files[0];
        document.getElementById("imageName").textContent = "📷 " + activeImageFile.name;
        document.getElementById("imagePreviewContainer").style.display = "flex";
      }
    }

    function clearSelectedImage() {
      activeImageFile = null;
      document.getElementById("cameraInput").value = "";
      document.getElementById("galleryInput").value = "";
      document.getElementById("imagePreviewContainer").style.display = "none";
    }

    function toBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = error => reject(error);
      });
    }

    // إرسال الطلب إلى Cloudflare Worker
    async function sendQuery() {
      const btn = document.getElementById("submitBtn");
      const resBox = document.getElementById("resultBox");
      const q = document.getElementById("question").value.trim();

      if (!q && !activeImageFile) {
        alert("يرجى كتابة سؤال أو التقاط/إرفاق صورة أولاً");
        return;
      }

      btn.disabled = true;
      btn.textContent = "جاري استخراج الجواب النموذجي الوزاري...";
      resBox.style.display = "block";
      resBox.textContent = "يرجى الانتظار، جاري التدقيق والحل وفق معايير وزارة التربية...";

      let imgBase64 = null;
      if (activeImageFile) {
        try {
          imgBase64 = await toBase64(activeImageFile);
        } catch (e) {
          console.error("فشل قراءة الصورة", e);
        }
      }

      const payload = {
        stage: document.getElementById("stage").value,
        grade: document.getElementById("grade").value,
        subject: document.getElementById("subject").value,
        question: q,
        image_base64: imgBase64
      };

      try {
        const response = await fetch("https://white-sun-3f8f.anasiraq85.workers.dev", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const resData = await response.json();
        resBox.textContent = resData.solution || resData.error || "تعذر الحصول على إجابة.";
      } catch (err) {
        resBox.textContent = "حدث خطأ أثناء الاتصال بالخادم. يرجى التأكد من اتصال الإنترنت والمحاولة ثانية.";
      } finally {
        btn.disabled = false;
        btn.textContent = "الحصول على الجواب النموذجي الوزاري";
      }
    }

    // تشغيل القوائم تلقائياً عند فتح الصفحة
    updateGrades();
  </script>
</body>
</html>
